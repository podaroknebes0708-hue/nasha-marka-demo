name: Site smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'proposal.html'
      - '.github/scripts/site-smoke.mjs'
      - '.github/workflows/site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout site files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test site on mobile and desktop, verify public URL
        run: node .github/scripts/site-smoke.mjs
